image:
  repository: emindsguardians/etl-authentication
  tag: v1

service:
  port: 5000
  nodePort: 30500
  type: NodePort

command: ["npm", "run", "server"]

dns:
  - 10.0.0.99
  - 8.8.8.8

volumeMounts:
  - name: env-file
    mountPath: /em-etl-authentication/.env
    subPath: .env

volumes:
  - name: env-file
    configMap:
      name: authentication-env

env:
  NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/brightchecksrootCA.crt
