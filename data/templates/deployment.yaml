apiVersion: apps/v1
kind: Deployment
metadata:
  name: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data
  template:
    metadata:
      labels:
        app: data
    spec:
      containers:
        - name: data
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
{{ toYaml .Values.command | indent 10 }}
          ports:
            - containerPort: {{ .Values.service.port }}
          volumeMounts:
{{ toYaml .Values.volumeMounts | indent 12 }}
      volumes:
{{ toYaml .Values.volumes | indent 8 }}
