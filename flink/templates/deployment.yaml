apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink
  namespace: brightchecks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink
  template:
    metadata:
      labels:
        app: flink
    spec:
      dnsConfig:
        nameservers: {{ toYaml .Values.dns | nindent 8 }}
      containers:
        - name: flink
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: {{ toYaml .Values.command | nindent 10 }}
          ports:
            - containerPort: {{ .Values.service.port }}
          volumeMounts:
            {{- toYaml .Values.volumeMounts | nindent 12 }}
      volumes:
        {{- toYaml .Values.volumes | nindent 8 }}
